<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hitung Cepat Pemilihan Ketua RT 004</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#14213d;--mut:#667189;--bd:#e0e5ee;--hd:#14305f;--gold:#f5b21b;--c0:#2563eb;--c1:#d97706;--c2:#0f9d6b;--bad:#7c3aed;--dng:#d9473d;--ok:#0f9d6b;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e131c;--card:#18202d;--tx:#e9eef7;--mut:#94a0b5;--bd:#2a3445;--hd:#1d3a70;--c0:#5b8dff;--c1:#f0a03a;--c2:#3ddc9a;--bad:#a78bfa;--dng:#ff7a70;--ok:#3ddc9a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.35;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.head{background:var(--hd);color:#fff;border-radius:16px;padding:16px;border-bottom:4px solid var(--gold)}
.head small{opacity:.8;font-size:12px;display:block}
.head h1{font-size:18px;margin:4px 0 0}
.pill{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;background:rgba(255,255,255,.14);border-radius:99px;padding:3px 10px}
.pill i{width:8px;height:8px;border-radius:50%;background:#aab}
.pill.on i{background:#3ddc9a}.pill.off i{background:#ff7a70}
.sum{display:flex;gap:8px;margin-top:12px}
.sum div{flex:1;background:rgba(255,255,255,.14);border-radius:10px;padding:8px;text-align:center}
.sum b{display:block;font-size:22px}
.sum span{font-size:11px;opacity:.85}
.lead{margin-top:10px;font-weight:700;font-size:14px;text-align:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-top:12px}
.cd{border-left:6px solid var(--cc)}
.top{display:flex;align-items:center;gap:10px}
.no{width:34px;height:34px;border-radius:10px;background:var(--cc);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.nm{font-weight:700;font-size:15px}
.big{font-size:56px;font-weight:800;line-height:1;margin:10px 0 6px;color:var(--cc)}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cc);border-radius:6px;transition:width .3s}
.pc{font-size:13px;color:var(--mut);margin-top:4px}
.bt{display:flex;gap:8px;margin-top:10px}
.plus{flex:1;padding:16px;border:0;border-radius:12px;background:var(--cc);color:#fff;font-size:18px;font-weight:800}
.plus:active{transform:scale(.98)}
.min{width:64px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font-size:16px;font-weight:700}
.bd{--cc:var(--bad)}
.bd .big{font-size:36px}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:8px;margin-top:12px}
.row button{flex:1;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font-size:14px;font-weight:600}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px;font-family:inherit}
textarea{display:none;height:150px;font-size:12px;margin-top:8px}
h2{font-size:15px;margin:0 0 8px}
.pri{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:var(--hd);color:#fff;font-weight:700;font-size:15px}
.sec{width:100%;margin-top:8px;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font-weight:600;font-size:14px}
.lg{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--bd);font-size:13px}
.lg:first-of-type{border-top:0}
.lg span{color:var(--mut);flex:none}
.msg{font-size:13px;text-align:center;color:var(--mut);margin-top:8px;min-height:16px}
.msg.err{color:var(--dng)}
.who{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.who button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:8px 12px;font-size:13px}
.hide{display:none!important}
body.lihat .bt,body.lihat #undoRow{display:none}
body.layar .auth,body.layar .tools,body.layar .bt,body.layar #undoRow,body.layar .logc{display:none}
body.layar .big{font-size:84px}
body.layar .nm{font-size:22px}
body.layar .head h1{font-size:26px}
.exit{display:none;position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));opacity:.7;padding:10px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
body.layar .exit{display:block}
@media (min-width:700px){
.wrap{max-width:1100px}
body.layar .wrap{max-width:1400px}
#cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
#cards .card{margin-top:0}
#cards{margin-top:12px}
#cards .bd{grid-column:1/-1}
.big{font-size:64px}
}
@media (orientation:landscape) and (max-height:520px){
.wrap{padding:10px}
.head{padding:10px 14px}
.sum{margin-top:8px}
.big{font-size:44px;margin:4px 0}
.plus{padding:12px}
.card{padding:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<div class="head">
<small>Panitia Pemilihan Ketua RT 004 RW 006 · Villa Athaland 2026</small>
<h1>Hitung Cepat Suara</h1>
<span class="pill" id="st"><i></i><span>Menyambungkan</span></span>
<div class="sum">
<div><b id="tot">0</b><span>Total masuk</span></div>
<div><b id="sah">0</b><span>Suara sah</span></div>
<div><b id="bad">0</b><span>Tidak sah</span></div>
</div>
<div class="lead" id="lead"></div>
</div>

<div class="card auth">
<div id="loginBox">
<h2>Login panitia</h2>
<div class="msg" style="margin:0;text-align:left">Tanpa login, kamu hanya bisa melihat hasil. Untuk ikut menghitung, masuk atau daftar dulu.</div>
<label for="em">Email</label>
<input id="em" type="email" autocomplete="email" placeholder="nama@email.com">
<label for="pw">Password (minimal 6 karakter)</label>
<input id="pw" type="password" autocomplete="current-password">
<button class="pri" id="masuk">Masuk</button>
<button class="sec" id="daftar">Daftar akun baru</button>
<div class="msg" id="am"></div>
</div>
<div id="userBox" class="who hide"><span id="who"></span><button id="keluar">Keluar</button></div>
</div>

<div id="cards"></div>

<div class="row" id="undoRow"><button id="undo">↶ Batalkan input terakhir saya</button></div>

<div class="card logc">
<h2>Riwayat input terakhir</h2>
<div id="log"></div>
</div>

<div class="row tools"><button id="layar">Mode layar</button><button id="cp">Salin rekap</button></div>
<textarea id="ta" readonly></textarea>
<div class="msg" id="msg"></div>
</div>
<button class="exit" id="exit">Keluar mode layar</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
var SB=supabase.createClient("https://anmsxirjyjphejkwxxhh.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFubXN4aXJqeWpwaGVqa3d4eGhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzMTU2MzIsImV4cCI6MjEwODg5MTYzMn0.eDLwfzEMuIKXy-fAO-WzfSLfFFBJ2ds7geUHawRfQE8");
var N=["Bp. Sunarto Hadi Putranto","Bp. Saefudin","Bp. Fingky Septiyan Abadi"];
var V=[],me=null;
function $(i){return document.getElementById(i)}
function pct(v,t){return t?(v/t*100).toFixed(1).replace(".",","):"0,0"}
function hm(t){var d=new Date(t);return ("0"+d.getHours()).slice(-2)+"."+("0"+d.getMinutes()).slice(-2)}
function setSt(k,t){$("st").className="pill "+k;$("st").lastChild.textContent=t}
function say(s){$("msg").textContent=s}
function am(s,e){$("am").textContent=s;$("am").className="msg"+(e?" err":"")}
function tr(m){m=m||"";if(/invalid login/i.test(m))return "Email atau password salah.";if(/already registered/i.test(m))return "Email ini sudah terdaftar, silakan masuk.";if(/at least 6/i.test(m))return "Password minimal 6 karakter.";if(/valid email|invalid format/i.test(m))return "Format email tidak valid.";if(/not confirmed/i.test(m))return "Email belum dikonfirmasi. Cek kotak masuk emailmu.";if(/signups? not allowed|disabled/i.test(m))return "Pendaftaran sedang ditutup.";if(/rate limit/i.test(m))return "Terlalu banyak percobaan. Tunggu beberapa menit.";return m}

async function load(){
var r=await SB.from("suara").select("id,calon,oleh,created_at").order("created_at",{ascending:true}).limit(1000);
if(r.error){setSt("off","Gagal memuat, cek sinyal");return}
V=r.data;setSt("on","Live · tersambung");render();
}
function cnt(){var c=[0,0,0],b=0;V.forEach(function(x){if(x.calon===-1)b++;else if(c[x.calon]!==undefined)c[x.calon]++});return{c:c,b:b}}
function render(){
var r=cnt(),sah=r.c[0]+r.c[1]+r.c[2],tot=sah+r.b,mx=Math.max(r.c[0],r.c[1],r.c[2]);
var lead=[0,1,2].filter(function(i){return r.c[i]===mx});
$("tot").textContent=tot;$("sah").textContent=sah;$("bad").textContent=r.b;
$("lead").textContent=sah===0?"Belum ada suara masuk":lead.length===1?"Unggul sementara: No. "+(lead[0]+1)+" "+N[lead[0]]:"Sementara seri";
var h=N.map(function(n,i){var v=r.c[i];return '<div class="card cd" style="--cc:var(--c'+i+')"><div class="top"><div class="no">'+(i+1)+'</div><div class="nm">'+n+'</div></div><div class="big">'+v+'</div><div class="bar"><i style="width:'+(sah?v/sah*100:0)+'%"></i></div><div class="pc">'+pct(v,sah)+'% dari suara sah</div><div class="bt"><button class="plus" data-k="'+i+'">+1 Suara</button><button class="min" data-m="'+i+'" aria-label="Kurangi suara '+n+'">−1</button></div></div>'}).join("");
h+='<div class="card cd bd"><div class="top"><div class="no">✕</div><div class="nm">Suara tidak sah</div></div><div class="big">'+r.b+'</div><div class="bt"><button class="plus" data-k="-1">+1 Tidak sah</button><button class="min" data-m="-1" aria-label="Kurangi suara tidak sah">−1</button></div></div>';
$("cards").innerHTML=h;
var L=V.length;
$("log").innerHTML=L?V.slice(-8).reverse().map(function(x,j){return '<div class="lg"><b>#'+(L-j)+' · '+(x.calon===-1?"Tidak sah":"No. "+(x.calon+1)+" "+N[x.calon])+(me&&x.oleh===me.id?" · Anda":"")+'</b><span>'+hm(x.created_at)+'</span></div>'}).join(""):'<div class="msg">Belum ada input</div>';
}

async function add(k){
if(!me)return;
try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}
var tmp={id:"tmp"+Date.now()+Math.random(),calon:k,oleh:me.id,created_at:new Date().toISOString()};
V.push(tmp);render();
var r=await SB.from("suara").insert({calon:k});
if(r.error){V=V.filter(function(x){return x!==tmp});render();setSt("off","Gagal menyimpan, tekan lagi")}else load();
}
async function del(row){
if(!row||!me)return;
V=V.filter(function(x){return x!==row});render();
if(String(row.id).indexOf("tmp")===0){load();return}
var r=await SB.from("suara").delete().eq("id",row.id);
if(r.error)setSt("off","Gagal membatalkan, coba lagi");
load();
}
function lastOf(f){for(var i=V.length-1;i>=0;i--){if(f(V[i]))return V[i]}return null}
$("cards").addEventListener("click",function(e){
var b=e.target.closest("button");if(!b)return;
if(b.dataset.k!==undefined)add(+b.dataset.k);
else if(b.dataset.m!==undefined){var k=+b.dataset.m;del(lastOf(function(x){return x.calon===k}))}
});
$("undo").onclick=function(){if(me)del(lastOf(function(x){return x.oleh===me.id}))};

function applyAuth(){
document.body.classList.toggle("lihat",!me);
$("loginBox").classList.toggle("hide",!!me);
$("userBox").classList.toggle("hide",!me);
$("who").textContent=me?"Masuk sebagai "+me.email:"";
render();
}
$("masuk").onclick=async function(){
var e=$("em").value.trim(),p=$("pw").value;
if(!e||!p){am("Isi email dan password dulu.",1);return}
am("Memproses…");
var r=await SB.auth.signInWithPassword({email:e,password:p});
if(r.error)am(tr(r.error.message),1);else{am("");$("pw").value=""}
};
$("daftar").onclick=async function(){
var e=$("em").value.trim(),p=$("pw").value;
if(!e||!p){am("Isi email dan password dulu.",1);return}
if(p.length<6){am("Password minimal 6 karakter.",1);return}
am("Memproses…");
var r=await SB.auth.signUp({email:e,password:p});
if(r.error)am(tr(r.error.message),1);
else if(!r.data.session)am("Akun dibuat. Cek email untuk konfirmasi, lalu tekan Masuk.");
else{am("");$("pw").value=""}
};
$("keluar").onclick=function(){SB.auth.signOut()};

function setLayar(on){
document.body.classList.toggle("layar",on);
if(on){try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(function(){})}catch(e){}try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(function(){})}catch(e){}}
else if(document.fullscreenElement){try{document.exitFullscreen()}catch(e){}}
}
$("layar").onclick=function(){setLayar(true)};
$("exit").onclick=function(){setLayar(false)};
document.addEventListener("keydown",function(e){if(e.key==="Escape")setLayar(false)});

function rekap(){
var r=cnt(),sah=r.c[0]+r.c[1]+r.c[2],tot=sah+r.b,d=new Date();
var t="HITUNG CEPAT PEMILIHAN KETUA RT 004 RW 006\nVilla Athaland Sindangmulya 2026\nWaktu: "+d.toLocaleDateString("id-ID")+" "+hm(d)+"\n\n";
N.forEach(function(n,i){t+=(i+1)+". "+n+": "+r.c[i]+" suara ("+pct(r.c[i],sah)+"%)\n"});
return t+"\nSuara sah: "+sah+"\nTidak sah: "+r.b+"\nTotal suara masuk: "+tot+"\n\n(Hasil sementara hitung cepat)";
}
$("cp").onclick=function(){
var t=rekap();
var show=function(){$("ta").style.display="block";$("ta").value=t;$("ta").focus();$("ta").select();say("Salin teks di atas lalu kirim ke grup.")};
try{navigator.clipboard.writeText(t).then(function(){say("Rekap disalin, tinggal tempel di grup.")},show)}catch(e){show()}
};

render();
SB.auth.getSession().then(function(s){me=s.data.session?s.data.session.user:null;applyAuth()});
SB.auth.onAuthStateChange(function(_e,s){me=s?s.user:null;applyAuth()});
load();
SB.channel("suara-rt").on("postgres_changes",{event:"*",schema:"public",table:"suara"},function(){load()}).subscribe();
setInterval(load,8000);
</script>
</body>
</html>
